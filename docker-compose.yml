name: xmrig-webui

services:
  dashboard:
    build: .
    image: ghcr.io/danyx64/xmrig.webui:latest
    container_name: xmrig-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      DB_PATH: /data/xmrig-webui.db
      REFRESH_SECONDS: ${REFRESH_SECONDS:-30}
      HISTORY_DAYS: ${HISTORY_DAYS:-7}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-6}
    volumes:
      - xmrig-webui-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  xmrig-webui-data:
