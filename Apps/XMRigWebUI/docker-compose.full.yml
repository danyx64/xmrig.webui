name: xmrig-webui-full

services:
  dashboard:
    image: ghcr.io/danyx64/xmrig.webui:latest
    pull_policy: always
    container_name: xmrig-webui
    restart: unless-stopped
    network_mode: host
    cpus: 0.000
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5300
      - --workers
      - "1"
      - --threads
      - "8"
      - --timeout
      - "30"
      - app:app
    environment:
      DB_PATH: /data/xmrig-webui.db
      REFRESH_SECONDS: "30"
      HISTORY_DAYS: "7"
      HTTP_TIMEOUT: "6"
      DEFAULT_POOL_URL: "https://supportxmr.com"
      DEFAULT_WALLET: "${XMR_WALLET}"
      AUTO_ADD_LOCAL_MINER: "1"
      DEFAULT_MINER_NAME: "${WORKER_NAME:-ZimaOS}"
      DEFAULT_MINER_API: "http://127.0.0.1:18088"
      DEFAULT_AGENT_URL: "http://127.0.0.1:18089"
    volumes:
      - type: bind
        source: /DATA/AppData/xmrig-webui/data
        target: /data
    security_opt:
      - no-new-privileges:true
    depends_on:
      - xmrig
      - agent

  xmrig:
    image: ghcr.io/danyx64/xmrig.webui:miner-6.26.0
    pull_policy: always
    container_name: xmrig-miner
    restart: unless-stopped
    privileged: true
    network_mode: host
    cpus: 0.000
    cpu_shares: 1024
    environment:
      XMRIG_THREADS: ${XMRIG_THREADS:-all}
    volumes:
      - type: bind
        source: /dev/cpu
        target: /dev/cpu
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command:
      - --coin=monero
      - --url=${XMR_POOL:-pool.supportxmr.com:3333}
      - --user=${XMR_WALLET:?set XMR_WALLET}
      - --pass=${WORKER_NAME:-ZimaOS}
      - --api-worker-id=${WORKER_NAME:-ZimaOS}
      - --http-host=0.0.0.0
      - --http-port=18088
      - --cpu-max-threads-hint=100
      - --cpu-no-yield
      - --cpu-priority=5
      - --huge-pages-jit
      - --keepalive
      - --print-time=30

  agent:
    image: ghcr.io/danyx64/xmrig.webui:latest
    pull_policy: always
    container_name: xmrig-temp-agent
    restart: unless-stopped
    network_mode: host
    cpus: 0.000
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:18089
      - --workers
      - "1"
      - --threads
      - "4"
      - agent:app
    environment:
      HOST_SYS: /host/sys
    volumes:
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    security_opt:
      - no-new-privileges:true

x-casaos:
  id: io.github.danyx64.xmrig-webui.full
  main: dashboard
  index: /
  port_map: "5300"
  scheme: http
  icon: https://raw.githubusercontent.com/danyx64/xmrig.webui/main/assets/icon.svg
  title:
    en_US: XMRig Unified WebUI + Miner
    it_IT: XMRig Unified WebUI + Miner
  tagline:
    en_US: Dashboard, XMRig miner and CPU temperature agent in one stack
    it_IT: Dashboard, miner XMRig e temperatura CPU in un unico stack
  description:
    en_US: All-in-one XMRig stack for ZimaOS with persistent dashboard, SupportXMR/MoneroOcean monitoring, XMRig CPU mining and temperature agent.
    it_IT: Stack XMRig completo per ZimaOS con dashboard persistente, monitoraggio SupportXMR/MoneroOcean, mining CPU XMRig e agent temperatura.
  author: danyx64
  developer: danyx64
  category: Finance
  architectures:
    - amd64
  version: "0.4.0"
  update_at: "2026-09-22"
  website: https://github.com/danyx64/xmrig.webui
  repo: https://github.com/danyx64/xmrig.webui
  support: https://github.com/danyx64/xmrig.webui/issues
  docs: https://github.com/danyx64/xmrig.webui#readme
